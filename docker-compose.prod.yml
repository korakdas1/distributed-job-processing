# Secure production-oriented overlay. Does not replace the development file.
#
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Compose v1 merges mapping keys and concatenates sequence fields such as ports.
# Base loopback mappings (127.0.0.1) therefore remain. Loopback is not public.
# Do not bind Postgres, Redis, or the API to 0.0.0.0 in this profile.
#
# Public HTTPS default: 127.0.0.1:8443 (set PUBLIC_BIND_ADDRESS=0.0.0.0 to expose).
#
# POSTGRES_PASSWORD has no development fallback in this overlay. Set it explicitly.
# Do not reuse this to rotate the existing development database password.
#
# HTTP API keys are mounted only into the api service (least privilege).
# publisher, scheduler, and worker do not receive VIEWER/OPERATOR credentials.
#
# no-new-privileges is intentionally omitted. On this host (Linux 7.0 + Docker 29),
# that flag makes execve of /bin/sh, /usr/local/bin/python, and nginx's entrypoint
# fail with EPERM. cap_drop ALL + read-only root remain for application roles.
# Official nginx cannot drop ALL (master chowns cache dirs).

version: "3.8"

x-secure-app: &secure-app
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  environment:
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the secure Compose profile}

x-secure-api: &secure-api
  <<: *secure-app
  environment:
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the secure Compose profile}
    SECURITY_MODE: production
    AUTH_ENABLED: "true"
    RATE_LIMIT_ENABLED: "true"
    DOCS_ENABLED: "false"
    VIEWER_API_KEY_FILE: /run/secrets/viewer_api_key
    OPERATOR_API_KEY_FILE: /run/secrets/operator_api_key
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:-600}
    RATE_LIMIT_READ_BURST: ${RATE_LIMIT_READ_BURST:-120}
    RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:-30}
    RATE_LIMIT_WRITE_BURST: ${RATE_LIMIT_WRITE_BURST:-10}
  volumes:
    - ${VIEWER_API_KEY_FILE:-./secrets/viewer_api_key}:/run/secrets/viewer_api_key:ro
    - ${OPERATOR_API_KEY_FILE:-./secrets/operator_api_key}:/run/secrets/operator_api_key:ro

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the secure Compose profile}

  api:
    <<: *secure-api

  publisher:
    <<: *secure-app

  scheduler:
    <<: *secure-app

  worker:
    <<: *secure-app

  dashboard:
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /run
      - /var/log/nginx
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTPS_HOST_PORT:-8443}:8443"
    volumes:
      - ./dashboard/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./secrets/tls/server.crt}:/run/secrets/tls/server.crt:ro
      - ${TLS_KEY_FILE:-./secrets/tls/server.key}:/run/secrets/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 8s
