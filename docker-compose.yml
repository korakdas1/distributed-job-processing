# Local multi-container architecture (Compose v1.29.2 and Compose v2).
# Host ports bind to 127.0.0.1 only. Application containers use Docker DNS.
#
# This file targets Docker Compose v1 (docker-compose 1.29+) and v2.
# depends_on conditions are omitted: Compose file 3.8 on v1.29 only accepts a list.

version: "3.8"

x-app-environment: &app-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-job_platform}
  POSTGRES_USER: ${POSTGRES_USER:-job_platform}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JOB_LEASE_TIMEOUT_SECONDS: ${JOB_LEASE_TIMEOUT_SECONDS:-60}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-2}
  WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-6}
  WORKER_DB_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_DB_HEARTBEAT_INTERVAL_SECONDS:-10}
  WORKER_CANCELLATION_POLL_INTERVAL_MS: ${WORKER_CANCELLATION_POLL_INTERVAL_MS:-250}

x-app-image: &app-image
  build: .
  image: job-platform-app:local
  restart: unless-stopped
  environment: *app-environment

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_platform}
      POSTGRES_USER: ${POSTGRES_USER:-job_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - job_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_platform} -d ${POSTGRES_DB:-job_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - job_platform_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    <<: *app-image
    command: ["/app/docker/entrypoint-api.sh"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

  publisher:
    <<: *app-image
    command: ["python", "-m", "job_platform.outbox"]
    depends_on:
      - postgres
      - api
    stop_grace_period: 15s

  scheduler:
    <<: *app-image
    command: ["python", "-m", "job_platform.scheduler"]
    depends_on:
      - postgres
      - api
    stop_grace_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: job-platform-dashboard:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3000}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 8s

  worker:
    <<: *app-image
    command: ["python", "-m", "job_platform.worker"]
    depends_on:
      - postgres
      - api
    stop_grace_period: 45s

volumes:
  job_platform_postgres_data:
  job_platform_redis_data:
