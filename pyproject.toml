[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-platform"
version = "0.1.0"
description = "Distributed job processing platform with FastAPI, PostgreSQL, Redis Streams, and independent workers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Owner" }]
keywords = ["distributed-systems", "job-queue", "fastapi", "redis", "postgresql"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "integration: tests that require local project PostgreSQL",
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "E402"]
"benchmarks/load/run_benchmarks.py" = ["E402"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scripts/*.sh"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["job_platform", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["job_platform"]
mypy_path = "src"
