name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install tested dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest tests/unit

  backend-integration:
    name: Ordinary backend integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: job_platform_test
          POSTGRES_USER: ci_job_platform
          # Public, disposable CI-only credential; never a development credential.
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_job_platform -d job_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: job_platform_test
      POSTGRES_USER: ci_job_platform
      POSTGRES_PASSWORD: ci-only-not-a-secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DB: '15'
      SECURITY_MODE: development
      AUTH_ENABLED: 'false'
      RATE_LIMIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install tested dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Expose Compose for static configuration tests
        run: |
          docker compose version
          mkdir -p "$RUNNER_TEMP/compose-bin"
          printf '#!/bin/sh\nexec docker compose "$@"\n' > "$RUNNER_TEMP/compose-bin/docker-compose"
          chmod +x "$RUNNER_TEMP/compose-bin/docker-compose"
          echo "$RUNNER_TEMP/compose-bin" >> "$GITHUB_PATH"
      # Default pytest collection skips all disruptive tests. No outage opt-in or manifest.
      - run: pytest tests/integration -rs

  frontend:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
